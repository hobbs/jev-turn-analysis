[package]
name = "jev-turn-analysis"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "jta"
path = "src/lib.rs"

[[bin]]
name = "jta"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
indicatif = "0.18"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
walkdir = "2"

[dev-dependencies]
